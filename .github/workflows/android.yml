name: Android 14 validation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android14:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned official Android command-line tools
        run: |
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          curl --fail --location --retry 3 'https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip' -o "$RUNNER_TEMP/android-tools.zip"
          printf 'e025545c62a8e64c7559119566a569fb1dec5f60  %s\n' "$RUNNER_TEMP/android-tools.zip" | sha1sum -c -
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$RUNNER_TEMP/android-tools"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          mv "$RUNNER_TEMP/android-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
      - name: SDK and emulator dependencies
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-34' 'build-tools;35.0.0' 'emulator' 'system-images;android-34;google_apis;x86_64'
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm
          echo no | avdmanager create avd --force --name ivi_api34 --package 'system-images;android-34;google_apis;x86_64'
          sed -i '/^disk.dataPartition.size=/d' "$HOME/.android/avd/ivi_api34.avd/config.ini"
          echo 'disk.dataPartition.size=2G' >> "$HOME/.android/avd/ivi_api34.avd/config.ini"
      - name: Compile and run bounded-protocol and policy checks
        run: |
          mkdir -p outputs
          bash scripts/build.sh > outputs/build-verification.txt 2>&1
          bash scripts/test-protocol.sh | tee outputs/protocol-checks.txt
      - name: Validate the delivered signed APKs
        run: |
          (cd dist && sha256sum -c SHA256SUMS.txt)
          cp dist/*.apk dist/SHA256SUMS.txt outputs/
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose outputs/ivi-lab-probe.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose outputs/ivi-lab-fixture.apk
      - name: Boot Android 14
        run: |
          "$ANDROID_HOME/emulator/emulator" -avd ivi_api34 -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect -memory 2048 -cores 2 > outputs/emulator.log 2>&1 &
          emulator_pid=$!
          booted=false
          for attempt in $(seq 1 90); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then tail -n 100 outputs/emulator.log; exit 1; fi
            state=$(timeout 5 adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
            if [ "$state" = 1 ]; then booted=true; break; fi
            sleep 2
          done
          if [ "$booted" != true ]; then tail -n 100 outputs/emulator.log; exit 1; fi
          adb -s emulator-5554 shell input keyevent 82
          adb -s emulator-5554 shell settings put global window_animation_scale 0
          adb -s emulator-5554 shell settings put global transition_animation_scale 0
          adb -s emulator-5554 shell settings put global animator_duration_scale 0
          adb -s emulator-5554 shell wm size 1080x1920
          adb -s emulator-5554 shell wm density 320
      - name: UI and report smoke test on signed delivery APKs
        run: python3 scripts/smoke.py --serial emulator-5554
      - name: Collect failure diagnostics
        if: failure()
        run: |
          if timeout 5 adb -s emulator-5554 shell true; then
            timeout 15 adb -s emulator-5554 logcat -d > outputs/failure-logcat.txt || true
            timeout 15 adb -s emulator-5554 shell uiautomator dump /sdcard/failure.xml || true
            timeout 5 adb -s emulator-5554 pull /sdcard/failure.xml outputs/failure.xml || true
            timeout 5 adb -s emulator-5554 exec-out screencap -p > outputs/failure.png || true
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android14-test-evidence
          path: outputs/
          retention-days: 14
